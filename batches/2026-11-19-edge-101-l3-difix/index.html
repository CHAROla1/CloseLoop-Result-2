<!doctype html><html lang="zh-CN"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>天元闭环评测结果总览</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0b0f14;color:#e7edf5;font:14px system-ui}header{padding:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}a{color:#4ecdc4}#status{padding:0 12px 10px;white-space:pre-wrap}iframe{width:100%;height:calc(100dvh - 115px);border:0}button{padding:8px;background:#17202c;color:inherit;border:1px solid #314055;border-radius:6px;cursor:pointer}.scene-menu{position:relative;max-width:65vw;min-width:200px}#runs-toggle{width:100%;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#runs{position:absolute;top:100%;left:0;z-index:20;width:max-content;min-width:100%;max-width:80vw;max-height:55vh;overflow:auto;background:#121923;border:1px solid #314055;border-radius:6px;padding:4px;box-shadow:0 12px 30px #0008}#runs [role=option]{padding:9px 12px;cursor:pointer;overflow-wrap:anywhere;border-radius:4px}#runs [aria-selected=true]{background:#124c50;color:#d8ffff}#runs [role=option]:focus{outline:2px solid #4ecdc4;outline-offset:-2px}#runs .current{color:#6ce8df;font-weight:bold;margin-left:12px}</style>
<header><strong>天元闭环评测结果</strong><div class="scene-menu"><button id="runs-toggle" aria-label="选择场景" aria-haspopup="listbox" aria-controls="runs" aria-expanded="false">选择场景 ▾</button><div id="runs" role="listbox" aria-label="评测场景" hidden></div></div><button id="refresh">刷新列表</button><a id="open" target="_blank" rel="noopener">单独打开</a></header>
<div id="status" role="status"></div><iframe id="report" title="天元闭环报告"></iframe>
<script>
let entries=[],selected='',focusIndex=0;const list=document.getElementById('runs'),toggle=document.getElementById('runs-toggle'),frame=document.getElementById('report'),status=document.getElementById('status'),link=document.getElementById('open');
function center(item){if(!item)return;const a=item.getBoundingClientRect(),b=list.getBoundingClientRect();list.scrollTop+=a.top-b.top-(list.clientHeight-a.height)/2}
function closeMenu(restore=false){list.hidden=true;toggle.setAttribute('aria-expanded','false');if(restore)toggle.focus()}
function focusOption(index){focusIndex=Math.max(0,Math.min(entries.length-1,index));const item=list.children[focusIndex];if(item){item.focus({preventScroll:true});center(item)}}
function openMenu(){if(!entries.length)return;list.hidden=false;toggle.setAttribute('aria-expanded','true');focusOption(Math.max(0,entries.findIndex(r=>r.id===selected)))}
function show(id){const r=entries.find(x=>x.id===id);if(!r)return;selected=r.id;toggle.textContent=(r.display_name||r.name)+' ▾';status.textContent=r.name+' · '+r.status+(r.error?' · '+r.error:'');for(const [i,item] of [...list.children].entries()){const current=entries[i].id===selected;item.setAttribute('aria-selected',String(current));item.tabIndex=current?0:-1;item.querySelector('.current').textContent=current?'✓ 当前':''}if(r.url){if(frame.getAttribute('src')!==r.url)frame.src=r.url;link.href=r.url;link.hidden=false}else{frame.removeAttribute('src');link.removeAttribute('href');link.hidden=true}if(location.hash!==('#'+encodeURIComponent(r.id)))location.hash=encodeURIComponent(r.id)}
function hashId(){try{return decodeURIComponent(location.hash.slice(1))}catch{return ''}}
async function refresh(){const old=hashId()||selected;const res=await fetch('catalog.json',{cache:'no-store'});if(!res.ok)throw Error('无法读取结果列表');entries=(await res.json()).runs;closeMenu();list.replaceChildren();for(const r of entries){const item=document.createElement('div');item.setAttribute('role','option');item.id='scene-option-'+list.children.length;item.tabIndex=-1;const name=document.createElement('span');name.textContent=r.display_name||r.name;const badge=document.createElement('span');badge.className='current';item.append(name,badge);item.title=r.name+' ['+r.status+']';item.onclick=()=>{show(r.id);closeMenu(true)};list.append(item)}const id=entries.some(r=>r.id===old)?old:(entries.find(r=>r.url)?.id||entries[0]?.id||'');if(entries.length)show(id);else{selected='';toggle.textContent='没有场景';status.textContent='未发现 run 目录';frame.removeAttribute('src');link.hidden=true}}
toggle.onclick=()=>list.hidden?openMenu():closeMenu();toggle.onkeydown=e=>{if(['ArrowDown','ArrowUp','Home','End'].includes(e.key)){e.preventDefault();openMenu();if(e.key==='Home')focusOption(0);if(e.key==='End')focusOption(entries.length-1)}};
list.onkeydown=e=>{let target=null;if(e.key==='ArrowDown')target=focusIndex+1;if(e.key==='ArrowUp')target=focusIndex-1;if(e.key==='Home')target=0;if(e.key==='End')target=entries.length-1;if(target!==null){e.preventDefault();focusOption(target)}else if(e.key==='Enter'||e.key===' '){e.preventDefault();if(entries[focusIndex])show(entries[focusIndex].id);closeMenu(true)}else if(e.key==='Tab')closeMenu()};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!list.hidden){e.preventDefault();closeMenu(true)}});document.addEventListener('pointerdown',e=>{if(!e.target.closest('.scene-menu'))closeMenu()});window.addEventListener('blur',()=>closeMenu());window.addEventListener('hashchange',()=>{const id=hashId();if(entries.some(r=>r.id===id)&&id!==selected)show(id)});
document.getElementById('refresh').onclick=()=>refresh().catch(e=>status.textContent=e.message);refresh().catch(e=>status.textContent=e.message);
</script></html>
